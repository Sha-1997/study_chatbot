<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Augmented Ilm</title>
<style>
  :root { --bg:#fafaf8; --fg:#1d1d1b; --card:#fff; --user:#1f6f5c; --muted:#6b6b66; --line:#e3e3de; --danger:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ececea; --card:#222221; --user:#2f8f77; --muted:#9a9a94; --line:#333331; --danger:#f2b8b5; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex;
           justify-content:space-between; align-items:center; gap:8px; }
  header h1 { font-size:18px; margin:0; }
  header button, .panel button { background:none; border:1px solid var(--line); color:var(--fg);
                  border-radius:8px; padding:6px 10px; cursor:pointer; }
  .panel { display:none; padding:12px 16px; border-bottom:1px solid var(--line);
           font-size:14px; color:var(--muted); max-height:40vh; overflow-y:auto; }
  .panel pre { margin:0; white-space:pre-wrap; font-family:inherit; }
  .doc { display:flex; justify-content:space-between; align-items:center; padding:6px 0;
         border-bottom:1px solid var(--line); color:var(--fg); }
  .doc small { color:var(--muted); }
  .doc button { color:var(--danger); }
  #status { margin:8px 0; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; line-height:1.45; }
  .user { align-self:flex-end; background:var(--user); color:#fff; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  input[type=text] { flex:1; padding:12px; border-radius:10px; border:1px solid var(--line);
          background:var(--card); color:var(--fg); font-size:16px; }
  form button { background:var(--user); color:#fff; border:0; border-radius:10px; padding:0 18px; font-size:16px; }
</style>
</head>
<body>
<header>
  <h1>📚 Study Chat-bot</h1>
  <div>
    <button id="notesBtn">Notes</button>
    <button id="memBtn">Memory</button>
  </div>
</header>

<div class="panel" id="notesPanel">
  <input type="file" id="file" accept=".pdf,.txt,.md">
  <button id="uploadBtn">Upload</button>
  <div id="status"></div>
  <div id="docs"></div>
</div>

<div class="panel" id="memPanel">
  <pre id="memText"></pre>
  <button id="clearBtn">Clear memory</button>
</div>

<div id="chat"></div>
<form id="form">
  <input type="text" id="input" placeholder="Ask about your notes or any topic" autocomplete="off" required>
  <button>Send</button>
</form>

<script>
const sessionId = crypto.randomUUID();
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const notesPanel = document.getElementById("notesPanel");
const memPanel = document.getElementById("memPanel");
const statusEl = document.getElementById("status");

function add(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = "";
  add("user", message);
  const pending = add("bot", "Thinking…");
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, message }),
    });
    const data = await res.json();
    pending.textContent = data.reply || "Error: " + data.error;
  } catch {
    pending.textContent = "Network error.";
  }
});

// ----- Notes -----
async function loadDocs() {
  const res = await fetch("/api/docs");
  const { docs } = await res.json();
  const box = document.getElementById("docs");
  box.innerHTML = "";
  if (!docs.length) { box.textContent = "No documents yet."; return; }
  for (const d of docs) {
    const row = document.createElement("div");
    row.className = "doc";
    const label = document.createElement("span");
    label.textContent = d.name + " ";
    const small = document.createElement("small");
    small.textContent = `(${d.chunk_count} passages)`;
    label.appendChild(small);
    const del = document.createElement("button");
    del.textContent = "Delete";
    del.onclick = async () => {
      await fetch("/api/docs/" + d.id, { method: "DELETE" });
      loadDocs();
    };
    row.append(label, del);
    box.appendChild(row);
  }
}

document.getElementById("notesBtn").onclick = () => {
  memPanel.style.display = "none";
  const open = notesPanel.style.display === "block";
  notesPanel.style.display = open ? "none" : "block";
  if (!open) loadDocs();
};

document.getElementById("uploadBtn").onclick = async () => {
  const file = document.getElementById("file").files[0];
  if (!file) { statusEl.textContent = "Choose a file first."; return; }
  statusEl.textContent = "Uploading and reading…";
  const form = new FormData();
  form.append("file", file);
  try {
    const res = await fetch("/api/upload", { method: "POST", body: form });
    const data = await res.json();
    statusEl.textContent = data.ok
      ? `Added "${data.name}" (${data.chunks} passages). You can ask about it now.`
      : "Error: " + data.error;
    if (data.ok) { document.getElementById("file").value = ""; loadDocs(); }
  } catch {
    statusEl.textContent = "Upload failed.";
  }
};

// ----- Memory -----
document.getElementById("memBtn").onclick = async () => {
  notesPanel.style.display = "none";
  if (memPanel.style.display === "block") { memPanel.style.display = "none"; return; }
  const res = await fetch("/api/memory");
  document.getElementById("memText").textContent = (await res.json()).memory;
  memPanel.style.display = "block";
};

document.getElementById("clearBtn").onclick = async () => {
  if (confirm("Clear everything I remember?")) {
    await fetch("/api/memory", { method: "DELETE" });
    document.getElementById("memText").textContent = "No memories yet.";
  }
};
</script>
</body>
</html>
